name: Build Android APK

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Ensure permanent Keystore exists (Auto-Commit)
        run: |
          if [ ! -f release.keystore ]; then
            echo "Keystore no encontrado. Generando uno permanente..."
            keytool -genkey -v -keystore release.keystore -alias catastro -keyalg RSA -keysize 2048 -validity 10000 -storepass catastro123 -keypass catastro123 -dname "CN=Catastro, OU=Dev, O=Catastro, L=Madrid, S=Madrid, C=ES"
            git config --global user.name 'GitHub Actions'
            git config --global user.email 'actions@github.com'
            git add release.keystore
            git commit -m "chore: generate permanent release.keystore for APK updates"
            git push
          else
            echo "Keystore permanente encontrado."
          fi

      - name: Prebuild Expo (Generate Android folder)
        run: npx expo prebuild --platform android

      - name: Build APK (Assemble Release)
        working-directory: android
        run: ./gradlew assembleRelease -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/release.keystore -Pandroid.injected.signing.store.password=catastro123 -Pandroid.injected.signing.key.alias=catastro -Pandroid.injected.signing.key.password=catastro123

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Catastro-APK
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: GeoCatastro v1.0.0 (APK Instalable)
          body: |
            🚀 **GeoCatastro v1.0.0 - Versión Oficial Firmada**

            ### 📱 ¿Cómo instalar en tu teléfono Android?
            1. Descarga el archivo **`app-release.apk`** adjunto abajo.
            2. Ábrelo en tu móvil y pulsa en **Instalar**.
            3. Si tenías una versión de prueba antigua instalada, desinstálala primero.
          files: android/app/build/outputs/apk/release/app-release.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
