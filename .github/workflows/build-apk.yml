name: Build Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Decode Keystore from Secret
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > $GITHUB_WORKSPACE/release.keystore

      - name: Prebuild Expo (Generate Android folder)
        run: npx expo prebuild --platform android

      - name: Setup Gradle Build Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK (Assemble Release)
        working-directory: android
        run: ./gradlew assembleRelease --build-cache --parallel -Porg.gradle.jvmargs="-Xmx4096m -XX:+UseParallelGC" -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/release.keystore -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} -Pandroid.injected.signing.key.alias=catastro -Pandroid.injected.signing.key.password=${{ secrets.KEYSTORE_PASSWORD }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Catastro-APK
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Extract Tag Message
        if: startsWith(github.ref, 'refs/tags/v')
        id: tag_message
        run: |
          TAG_MSG=$(git tag -l --format='%(contents)' ${{ github.ref_name }})
          if [ -z "$TAG_MSG" ] || [ ${#TAG_MSG} -lt 15 ]; then
            TAG_MSG="* ⭐ **Gestor de Favoritos y Fincas con Notas:** Guarda parcelas favoritas con nombre personalizado y notas privadas.\n* 🌾 **Búsqueda Rústica Directa:** Búsqueda por Provincia, Municipio, Polígono y Parcela con autocompletado y posicionamiento automático.\n* 💾 **Guardado de Mediciones:** Historial persistente para almacenar trazados y polígonos calculados.\n* 📤 **Exportación e 📥 Importación KML:** Compatibilidad total con Google Earth y QGIS.\n* 🧭 **Orientación con Brújula y Punto Azul en Vivo:** Seguimiento dinámico con halo pulsante, cono y flecha de rumbo estilo Google Maps.\n* 🏗️ **Arquitectura Modular:** Refactorización integral del código y optimizaciones de rendimiento."
          fi
          echo "tag_msg<<EOF" >> $GITHUB_OUTPUT
          echo -e "$TAG_MSG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release (Only on Version Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: |
            🚀 **GeoCatastro ${{ github.ref_name }}**

            ### ✨ Novedades de esta versión:
            ${{ steps.tag_message.outputs.tag_msg }}

            ### 📱 ¿Cómo instalar en tu teléfono Android?
            1. Descarga el archivo **`app-release.apk`** adjunto abajo.
            2. Ábrelo en tu móvil y pulsa en **Instalar**.
            3. Se puede actualizar directamente desde la versión anterior.
          files: android/app/build/outputs/apk/release/app-release.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
